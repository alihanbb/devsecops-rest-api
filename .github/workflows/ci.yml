name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  lint-test-build:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Enforce line coverage threshold
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p='coverage/coverage-summary.json';if(!fs.existsSync(p)){throw new Error('coverage summary missing')}const summary=JSON.parse(fs.readFileSync(p,'utf8'));const linePct=summary.total.lines.pct;const threshold=80;if(linePct < threshold){throw new Error('Coverage threshold failed: '+linePct+'% < '+threshold+'%')}console.log('Coverage gate passed:',linePct+'%')"

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: devsecops-rest-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

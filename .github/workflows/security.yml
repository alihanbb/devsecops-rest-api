name: Security Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t devsecops-rest-api:scan .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devsecops-rest-api:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

  sonarqube-sast:
    runs-on: ubuntu-latest
    needs: dependency-and-secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage for Sonar
        run: npm run test:coverage

      - name: Prepare SonarQube configuration
        id: sonar-prepare
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ] || [ -z "${SONAR_HOST_URL}" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN or SONAR_HOST_URL is missing for this run."
            exit 0
          fi

          case "${SONAR_HOST_URL}" in
            http://*|https://*)
              echo "run_scan=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "SONAR_HOST_URL must start with http:// or https://"
              exit 1
              ;;
          esac

      - name: Enforce SonarQube secrets on push
        if: ${{ github.event_name == 'push' && steps.sonar-prepare.outputs.run_scan != 'true' }}
        run: |
          echo "SONAR_TOKEN and SONAR_HOST_URL are required for push events."
          exit 1

      - name: SonarQube scan
        if: ${{ steps.sonar-prepare.outputs.run_scan == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Skip SonarQube scan (missing secrets)
        if: ${{ steps.sonar-prepare.outputs.run_scan != 'true' }}
        run: echo "Skipping SonarQube scan because SONAR_TOKEN or SONAR_HOST_URL is not available in this context."

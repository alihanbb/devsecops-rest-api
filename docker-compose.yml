services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=devsecops
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devsecops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - observability

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devsecops-rest-api:local
    env_file:
      - .env.example
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=devsecops
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    labels:
      logging: "promtail"
      service: "api"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - observability

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yaml:ro
      - ./observability/data/loki:/loki
    restart: unless-stopped
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yaml:ro
      - ./observability/data/tempo:/tmp/tempo
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/data/prometheus:/prometheus
    restart: unless-stopped
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  postgres_data:
